services:
  mariadb:
    container_name: firefox_mariadb
    # Upgraded to MariaDB 10.11 LTS (supported until Feb 2028).
    # You can also use mariadb:11.4 (LTS until May 2029) or mariadb:10.6.
    image: mariadb:10.11
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./data/initdb.d/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      MYSQL_USER: sync
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Automatically upgrades table structures when upgrading across MariaDB series
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  syncserver:
    container_name: firefox_syncserver
    build:
      context: ./app/
      args:
        # Pinned to latest stable release; can be overridden via .env
        SYNC_VERSION: ${SYNC_VERSION:-0.25.0}
    restart: unless-stopped
    ports:
      - "5000:8000"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # General Settings
      LOGLEVEL: ${LOGLEVEL}
      SYNC_URL: ${SYNC_URL}
      SYNC_CAPACITY: ${SYNC_CAPACITY}
      SYNC_MASTER_SECRET: ${SYNC_MASTER_SECRET}
      METRICS_HASH_SECRET: ${METRICS_HASH_SECRET}

      # Database Connection Details
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SYNCSTORAGE_NAME: ${DB_SYNCSTORAGE_NAME}
      DB_TOKENSERVER_NAME: ${DB_TOKENSERVER_NAME}

      # Full URLs constructed for the application
      SYNC_SYNCSTORAGE_DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_SYNCSTORAGE_NAME}
      SYNC_TOKENSERVER_DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_TOKENSERVER_NAME}

volumes:
  mariadb_data:

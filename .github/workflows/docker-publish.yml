name: Build and Publish SyncServer Image

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if tag already exists'
        required: false
        type: boolean
        default: false
      sync_version:
        description: 'Specific version to build (leave blank for latest upstream release)'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Determine latest version
        id: check
        run: |
          if [ -n "${{ inputs.sync_version }}" ]; then
            TARGET_VERSION="${{ inputs.sync_version }}"
          else
            # Fetch latest semantic release tag from mozilla-services/syncstorage-rs
            TARGET_VERSION=$(git ls-remote --tags --refs https://github.com/mozilla-services/syncstorage-rs '0.*' \
              | awk -F'/' '{print $3}' | sort -V | tail -n 1)
          fi
          echo "Target version: $TARGET_VERSION"
          echo "version=$TARGET_VERSION" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Forced build requested."
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "Code push to main - building image."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://ghcr.io/v2/${{ github.repository }}/manifests/${TARGET_VERSION}" || true)
            echo "GHCR status code for ${TARGET_VERSION}: ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "Version ${TARGET_VERSION} is already published in GHCR."
              echo "should_build=false" >> $GITHUB_OUTPUT
            else
              echo "New version ${TARGET_VERSION} found! Building..."
              echo "should_build=true" >> $GITHUB_OUTPUT
            fi
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.check-version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: app
          push: true
          build-args: |
            SYNC_VERSION=${{ needs.check-version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
